name: Terraform staging plan

on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize all workflow runs that operate on this staging state.
concurrency:
  group: terraform-staging
  cancel-in-progress: false

jobs:
  backend-check:
    name: Initialize R2 backend and validate
    runs-on: ubuntu-latest
    environment: staging
    env:
      TF_IN_AUTOMATION: "true"
      AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      AWS_REGION: auto
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CF_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SB_TOKEN }}
      TF_VAR_supabase_database_password: ${{ secrets.SB_STAGING_DB_PASSWORD }}
      TF_VAR_supabase_organization_id: ${{ vars.SB_ORG_ID }}
      TF_VAR_supabase_project_name: ${{ vars.SB_PROJECT_NAME }}
      TF_VAR_supabase_region: ${{ vars.SB_REGION }}
      R2_BUCKET: ${{ vars.CF_R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.CF_R2_ENDPOINT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Check required settings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID" || { echo "Missing staging secret CF_R2_ACCESS_ID" >&2; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "Missing staging secret CF_R2_SECRET_ACCESS_KEY" >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing staging secret CF_TOKEN" >&2; exit 1; }
          test -n "$TF_VAR_cloudflare_account_id" || { echo "Missing staging variable CF_ACCOUNT_ID" >&2; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing staging secret SB_TOKEN" >&2; exit 1; }
          test -n "$TF_VAR_supabase_database_password" || { echo "Missing staging secret SB_STAGING_DB_PASSWORD" >&2; exit 1; }
          test -n "$TF_VAR_supabase_organization_id" || { echo "Missing staging variable SB_ORG_ID" >&2; exit 1; }
          test -n "$TF_VAR_supabase_project_name" || { echo "Missing staging variable SB_PROJECT_NAME" >&2; exit 1; }
          test -n "$TF_VAR_supabase_region" || { echo "Missing staging variable SB_REGION" >&2; exit 1; }
          test -n "$R2_BUCKET" || { echo "Missing staging variable CF_R2_BUCKET" >&2; exit 1; }
          test -n "$R2_ENDPOINT" || { echo "Missing staging variable CF_R2_ENDPOINT" >&2; exit 1; }

      - name: Create temporary backend config
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/backend.hcl" <<EOF
          bucket = "$R2_BUCKET"
          key    = "pantry-manager/staging/terraform.tfstate"
          region = "auto"

          endpoints = {
            s3 = "$R2_ENDPOINT"
          }

          skip_credentials_validation = true
          skip_metadata_api_check     = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          skip_s3_checksum            = true
          use_path_style              = true
          EOF

      - name: Initialize remote backend
        run: terraform -chdir=infra/terraform init -input=false -reconfigure -backend-config="$RUNNER_TEMP/backend.hcl"

      - name: Validate Terraform configuration
        run: terraform -chdir=infra/terraform validate

      - name: Create Terraform plan
        run: terraform -chdir=infra/terraform plan -input=false -no-color
