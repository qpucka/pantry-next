name: Terraform staging plan and state check

on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize every workflow that accesses this staging state.
concurrency:
  group: terraform-staging
  cancel-in-progress: false

jobs:
  recover-state:
    name: Plan managed staging resources only
    runs-on: ubuntu-latest
    environment: staging
    env:
      TF_IN_AUTOMATION: "true"
      AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      AWS_REGION: auto
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CF_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SB_TOKEN }}
      TF_VAR_supabase_database_password: ${{ secrets.SB_STAGING_DB_PASSWORD }}
      TF_VAR_supabase_organization_id: ${{ vars.SB_ORG_ID }}
      TF_VAR_supabase_project_name: ${{ vars.SB_PROJECT_NAME }}
      TF_VAR_supabase_region: ${{ vars.SB_REGION }}
      R2_BUCKET: ${{ vars.CF_R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.CF_R2_ENDPOINT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Check required settings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID" || { echo "Missing secret CF_R2_ACCESS_ID" >&2; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "Missing secret CF_R2_SECRET_ACCESS_KEY" >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing secret CF_TOKEN" >&2; exit 1; }
          test -n "$TF_VAR_cloudflare_account_id" || { echo "Missing variable CF_ACCOUNT_ID" >&2; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing secret SB_TOKEN" >&2; exit 1; }
          test -n "$TF_VAR_supabase_database_password" || { echo "Missing secret SB_STAGING_DB_PASSWORD" >&2; exit 1; }
          test -n "$TF_VAR_supabase_organization_id" || { echo "Missing variable SB_ORG_ID" >&2; exit 1; }
          test -n "$TF_VAR_supabase_project_name" || { echo "Missing variable SB_PROJECT_NAME" >&2; exit 1; }
          test -n "$TF_VAR_supabase_region" || { echo "Missing variable SB_REGION" >&2; exit 1; }
          test -n "$R2_BUCKET" || { echo "Missing variable CF_R2_BUCKET" >&2; exit 1; }
          test -n "$R2_ENDPOINT" || { echo "Missing variable CF_R2_ENDPOINT" >&2; exit 1; }
          test "$TF_VAR_supabase_project_name" = "pantry-next" || { echo "Unexpected project name; refusing state recovery" >&2; exit 1; }
          test "$TF_VAR_supabase_organization_id" = "pevzfsvmmbpwzqhhzxhu" || { echo "Unexpected organization; refusing state recovery" >&2; exit 1; }
          test "$TF_VAR_supabase_region" = "us-east-2" || { echo "Unexpected region; refusing staging plan" >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing secret CF_TOKEN" >&2; exit 1; }
          test -n "$TF_VAR_cloudflare_account_id" || { echo "Missing variable CF_ACCOUNT_ID" >&2; exit 1; }

      - name: Create temporary backend config
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/backend.hcl" <<EOF
          bucket = "$R2_BUCKET"
          key    = "pantry-manager/staging/terraform.tfstate"
          region = "auto"

          endpoints = {
            s3 = "$R2_ENDPOINT"
          }

          skip_credentials_validation = true
          skip_metadata_api_check     = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          skip_s3_checksum            = true
          use_path_style              = true
          EOF

      - name: Initialize R2 backend
        run: terraform -chdir=infra/terraform init -input=false -reconfigure -backend-config="$RUNNER_TEMP/backend.hcl"

      # Never print raw state: it contains the database password.
      - name: Verify Terraform state contains the existing project
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/terraform state pull | python3 -c '
          import json, sys
          state = json.load(sys.stdin)
          matches = []
          for resource in state.get("resources", []):
              if resource.get("mode") == "managed" and resource.get("type") == "supabase_project" and resource.get("name") == "staging":
                  for instance in resource.get("instances", []):
                      matches.append((resource, instance))
          if len(matches) != 1:
              raise SystemExit(f"Refusing recovery: expected one supabase_project.staging state instance; found {len(matches)}")
          resource, instance = matches[0]
          attrs = instance.get("attributes", {})
          checks = {"name": "pantry-next", "organization_id": "pevzfsvmmbpwzqhhzxhu", "region": "us-east-2"}
          for key, expected in checks.items():
              if attrs.get(key) != expected:
                  raise SystemExit(f"Refusing recovery: state {key} did not match expected project")
          status = instance.get("status", "ready")
          if status == "tainted":
              raise SystemExit("State is tainted; stop and investigate before planning or applying.")
          project_ref = attrs.get("id")
          if not project_ref:
              raise SystemExit("Refusing recovery: project reference is missing from state")
          print("Verified existing Supabase project in state. Project reference:", project_ref)
          print("No passwords or other secret attributes were printed.")
          '

      - name: Create fresh plan (no apply)
        run: terraform -chdir=infra/terraform plan -input=false -no-color -out="$RUNNER_TEMP/staging.tfplan"

      - name: Verify recovery plan has no destroy or replacement
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/terraform show -json "$RUNNER_TEMP/staging.tfplan" |
            python3 -c '
          import json, sys
          plan = json.load(sys.stdin)
          changes = [c for c in plan.get("resource_changes", []) if c.get("change", {}).get("actions") != ["no-op"]]
          for change in changes:
              actions = change.get("change", {}).get("actions", [])
              print(change.get("address", "unknown"), "actions=" + ",".join(actions))
              if "delete" in actions:
                  raise SystemExit("Refusing recovery: plan contains a destroy or replacement. No apply was run.")
          if not changes:
              print("Recovery plan is clean: no resource changes. No apply was run.")
          else:
              print("Plan has non-destructive changes for review only. No apply was run.")
          '
