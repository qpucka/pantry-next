on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/worker/**"

concurrency:
  group: ${{ github.event.repository.name }}-infra
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Pantry Next Worker
    runs-on: ubuntu-latest
    environment: terraform
    defaults:
      run:
        working-directory: apps/worker
    env:
      TF_IN_AUTOMATION: "true"
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      AWS_REGION: auto
      AWS_ENDPOINT_URL_S3: ${{ vars.CLOUDFLARE_R2_ENDPOINT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify required settings
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_R2_BUCKET \
            AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_ENDPOINT_URL_S3; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if ((${#missing[@]})); then
            printf 'Missing setting: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Set web build metadata
        run: echo "VITE_COMMIT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build web application
        working-directory: apps/web
        run: npm run build

      - name: Install Worker dependencies
        run: npm ci

      - name: Typecheck Worker
        run: npm run typecheck

      - name: Run Worker tests
        run: npm test

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Read deployment settings from Terraform state
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          terraform -chdir=infra/terraform init -input=false -reconfigure \
            -backend-config="bucket=$CLOUDFLARE_R2_BUCKET"

          worker_name="$(terraform -chdir=infra/terraform output -raw worker_name)"
          hyperdrive_id="$(terraform -chdir=infra/terraform output -raw hyperdrive_id)"
          supabase_url="$(terraform -chdir=infra/terraform output -raw supabase_url)"
          supabase_publishable_key="$(terraform -chdir=infra/terraform output -raw supabase_publishable_key)"
          echo "::add-mask::$supabase_publishable_key"

          export HYPERDRIVE_ID="$hyperdrive_id"
          envsubst '${HYPERDRIVE_ID}' \
            < apps/worker/wrangler.json \
            > apps/worker/wrangler.ci.json

          missing=()
          [[ -n "$worker_name" ]] || missing+=(worker_name)
          [[ -n "$supabase_url" ]] || missing+=(supabase_url)
          [[ -n "$supabase_publishable_key" ]] || missing+=(supabase_publishable_key)
          if ((${#missing[@]})); then
            printf 'Terraform state is missing required output: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          {
            echo "WORKER_NAME=$worker_name"
            echo "SUPABASE_URL=$supabase_url"
            echo "SUPABASE_PUBLISHABLE_KEY=$supabase_publishable_key"
          } >> "$GITHUB_ENV"

      - name: Validate Worker bundle
        shell: bash
        run: |
          set -euo pipefail
          test -d ../web/dist
          npx --yes wrangler@4.152.0 deploy \
            --config wrangler.ci.json \
            --name "$WORKER_NAME" \
            --dry-run

      - name: Upload Worker version
        shell: bash
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-upload.jsonl
        run: |
          set -euo pipefail
          rm -f "$WRANGLER_OUTPUT_FILE_PATH"

          # The rendered config includes the Terraform-owned Hyperdrive ID.
          # The committed config keeps only the ${HYPERDRIVE_ID} placeholder.
          npx --yes wrangler@4.152.0 versions upload \
            --config wrangler.ci.json \
            --name "$WORKER_NAME" \
            --var "SUPABASE_URL:$SUPABASE_URL" \
            --var "SUPABASE_PUBLISHABLE_KEY:$SUPABASE_PUBLISHABLE_KEY"

          version_id="$(jq -r '.version_id // empty' "$WRANGLER_OUTPUT_FILE_PATH")"
          if [[ -z "$version_id" ]]; then
            echo "Wrangler did not return an uploaded version ID." >&2
            cat "$WRANGLER_OUTPUT_FILE_PATH" >&2
            exit 1
          fi
          echo "WORKER_VERSION_ID=$version_id" >> "$GITHUB_ENV"

      - name: Deploy Worker version
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.152.0 versions deploy \
            --name "$WORKER_NAME" \
            --version-id "$WORKER_VERSION_ID" \
            --percentage 100 \
            --yes

      - name: Smoke-check deployed main page
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            echo "Smoke check failed: $1" >&2
            exit 1
          }

          account_subdomain="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" |
              jq -er '.result.subdomain'
          )" || fail "Cloudflare did not return the account workers.dev subdomain"
          worker_url="https://${WORKER_NAME}.${account_subdomain}.workers.dev/"
          expected_build="${GITHUB_SHA::7}"
          page_file="$RUNNER_TEMP/pantry-next-page.html"
          asset_file="$RUNNER_TEMP/pantry-next-asset.js"

          echo "Checking deployed Worker URL: $worker_url"
          echo "Expected build hash: $expected_build"

          page_status="$(curl --silent --show-error --output "$page_file" --write-out '%{http_code}' "$worker_url")" || \
            fail "request to the deployed main page failed"
          echo "Main page HTTP status: $page_status"
          [[ "$page_status" == "200" ]] || fail "main page returned HTTP $page_status"

          grep -Fq '<div id="root"></div>' "$page_file" || \
            fail "main page did not contain the React root element"

          asset_path="$(grep -oE 'src="[^" ]+\.js"' "$page_file" | head -n 1 | cut -d'"' -f2)"
          [[ -n "$asset_path" ]] || fail "main page did not identify a JavaScript asset"
          echo "JavaScript asset path: $asset_path"

          asset_url="${worker_url%/}${asset_path}"
          asset_status="$(curl --silent --show-error --output "$asset_file" --write-out '%{http_code}' "$asset_url")" || \
            fail "request to the JavaScript asset failed"
          echo "JavaScript asset HTTP status: $asset_status"
          [[ "$asset_status" == "200" ]] || fail "JavaScript asset returned HTTP $asset_status"

          grep -Fq -- "$expected_build" "$asset_file" || \
            fail "JavaScript asset did not contain the expected build hash"

          echo "Smoke check passed for $worker_url (build $expected_build)"

      - name: Clean up
        if: always()
        shell: bash
        working-directory: .
        run: rm -f "$RUNNER_TEMP/wrangler-upload.jsonl" apps/worker/wrangler.ci.json && rm -rf infra/terraform/.terraform
