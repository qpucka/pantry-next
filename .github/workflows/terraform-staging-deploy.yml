name: Terraform staging deploy health check

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type exactly: DEPLOY pantry-next-healthcheck'
        required: true
        type: string

permissions:
  contents: read

# Serialize every workflow that accesses this staging state.
concurrency:
  group: terraform-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy health-check Worker
    runs-on: ubuntu-latest
    environment: staging
    env:
      TF_IN_AUTOMATION: "true"
      AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      AWS_REGION: auto
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CF_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SB_TOKEN }}
      TF_VAR_supabase_database_password: ${{ secrets.SB_STAGING_DB_PASSWORD }}
      TF_VAR_supabase_organization_id: ${{ vars.SB_ORG_ID }}
      TF_VAR_supabase_project_name: ${{ vars.SB_PROJECT_NAME }}
      TF_VAR_supabase_region: ${{ vars.SB_REGION }}
      R2_BUCKET: ${{ vars.CF_R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.CF_R2_ENDPOINT }}
      APPLY_CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Verify confirmation and required settings
        shell: bash
        run: |
          set -euo pipefail
          test "$APPLY_CONFIRMATION" = "DEPLOY pantry-next-healthcheck" || {
            echo 'Confirmation must exactly match: DEPLOY pantry-next-healthcheck' >&2
            exit 1
          }
          test -n "$AWS_ACCESS_KEY_ID" || { echo "Missing secret CF_R2_ACCESS_ID" >&2; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "Missing secret CF_R2_SECRET_ACCESS_KEY" >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing secret CF_TOKEN" >&2; exit 1; }
          test -n "$TF_VAR_cloudflare_account_id" || { echo "Missing variable CF_ACCOUNT_ID" >&2; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing secret SB_TOKEN" >&2; exit 1; }
          test -n "$TF_VAR_supabase_database_password" || { echo "Missing secret SB_STAGING_DB_PASSWORD" >&2; exit 1; }
          test -n "$TF_VAR_supabase_organization_id" || { echo "Missing variable SB_ORG_ID" >&2; exit 1; }
          test -n "$TF_VAR_supabase_project_name" || { echo "Missing variable SB_PROJECT_NAME" >&2; exit 1; }
          test -n "$TF_VAR_supabase_region" || { echo "Missing variable SB_REGION" >&2; exit 1; }
          test -n "$R2_BUCKET" || { echo "Missing variable CF_R2_BUCKET" >&2; exit 1; }
          test -n "$R2_ENDPOINT" || { echo "Missing variable CF_R2_ENDPOINT" >&2; exit 1; }
          test "$TF_VAR_supabase_project_name" = "pantry-next" || { echo "Unexpected Supabase project; refusing deployment" >&2; exit 1; }
          test "$TF_VAR_supabase_organization_id" = "pevzfsvmmbpwzqhhzxhu" || { echo "Unexpected Supabase organization; refusing deployment" >&2; exit 1; }
          test "$TF_VAR_supabase_region" = "us-east-2" || { echo "Unexpected Supabase region; refusing deployment" >&2; exit 1; }

      - name: Create temporary backend config
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/backend.hcl" <<EOF
          bucket = "$R2_BUCKET"
          key    = "pantry-manager/staging/terraform.tfstate"
          region = "auto"

          endpoints = {
            s3 = "$R2_ENDPOINT"
          }

          skip_credentials_validation = true
          skip_metadata_api_check     = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          skip_s3_checksum            = true
          use_path_style              = true
          EOF

      - name: Initialize R2 backend
        run: terraform -chdir=infra/terraform init -input=false -reconfigure -backend-config="$RUNNER_TEMP/backend.hcl"

      - name: Validate Terraform configuration
        run: terraform -chdir=infra/terraform validate

      - name: Create fresh deployment plan
        run: terraform -chdir=infra/terraform plan -input=false -no-color -out="$RUNNER_TEMP/healthcheck.tfplan"

      # Plan JSON includes sensitive state. Inspect in-process, print only safe
      # addresses/actions, and never upload the plan or JSON as an artifact.
      - name: Verify plan contains only the intended Worker deployment
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/terraform show -json "$RUNNER_TEMP/healthcheck.tfplan" |
            python3 -c '
          import json, os, sys
          plan = json.load(sys.stdin)
          expected_addresses = {
              "cloudflare_worker.healthcheck",
              "cloudflare_worker_version.healthcheck",
          }
          changes = [
              item for item in plan.get("resource_changes", [])
              if item.get("change", {}).get("actions") != ["no-op"]
          ]
          actual_addresses = {item.get("address") for item in changes}
          if actual_addresses != expected_addresses or len(changes) != 2:
              summary = [(item.get("address", "unknown"), item.get("change", {}).get("actions", [])) for item in changes]
              raise SystemExit(f"Refusing deployment: expected only the two health-check Worker creates; got {summary}")
          for item in changes:
              if item.get("change", {}).get("actions") != ["create"]:
                  raise SystemExit("Refusing deployment: plan contains an update, delete, or replacement")
              after = item.get("change", {}).get("after") or {}
              address = item["address"]
              if address == "cloudflare_worker.healthcheck":
                  expected = {"name": "pantry-next-healthcheck", "account_id": os.environ["TF_VAR_cloudflare_account_id"]}
                  for key, value in expected.items():
                      if after.get(key) != value:
                          raise SystemExit(f"Refusing deployment: Worker {key} did not match expected value")
              else:
                  if after.get("main_module") != "index.js" or after.get("deploy") is not True:
                      raise SystemExit("Refusing deployment: Worker version is not the expected deployed module")
          print("Plan guard passed: only the health-check Worker and its version will be created; no existing resource will change or be destroyed.")
          '

      - name: Apply the exact verified plan
        run: terraform -chdir=infra/terraform apply -input=false -no-color "$RUNNER_TEMP/healthcheck.tfplan"

      - name: Show health-check URL
        run: terraform -chdir=infra/terraform output -raw healthcheck_worker_url
